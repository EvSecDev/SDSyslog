version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    # Complexity
    - funlen
    - lll
    - dupl
    # Style / naming / layout
    - misspell
    - asciicheck
    - bidichk
    - decorder
    - godox
    - dupword
    - inamedparam
    - interfacebloat
    - funcorder
    - grouper
    - mirror
    - usestdlibvars
    - gosmopolitan
    - musttag
    - gochecksumtype
    - goconst
    - gocritic
    - whitespace
    - varnamelen
    - nolintlint
    # Error handling / correctness
    - errorlint
    - errchkjson
    - errname
    - nilerr
    - nilnil
    - nilnesserr
    - noinlineerr
    - wrapcheck
    - durationcheck
    - exptostd
    - nosprintfhostport
    - asasalint
    # Security
    - gosec
    # Performance / waste
    - unconvert
    - wastedassign
    - reassign
    - forcetypeassert
    # Resource / context / concurrency
    - bodyclose
    - spancheck
    - copyloopvar
    - intrange
    # Structs / tags / DB
    - rowserrcheck
    - sqlclosecheck
    - recvcheck
    - protogetter
    - iotamixing
    - embeddedstructfieldcheck
    - iface
    # Modules / imports / docs
    - gomoddirectives
    - importas
    - godoclint
    - goprintffuncname
    - gocheckcompilerdirectives
    # Tests
    - testifylint
    - thelper
    - tparallel
    - usetesting
    - testableexamples
    - ginkgolinter
    # Misc
    - unqueryvet

  settings:
    # Enforces "no single-letter variables"
    # (names < 2 chars flagged, incl. loop/temp vars via max-distance: 1).
    varnamelen:
      min-name-length: 2
      max-distance: 1
      check-receiver: true
      check-return: true
      check-type-param: false
    funlen:
      lines: 250
      statements: 100
    nestif:
      min-complexity: 4
    lll:
      line-length: 150
      tab-width: 4
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 10
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - unnamedResult
    godoclint:
      disable:
        - pkg-doc           # drop "Package x ..." format enforcement
        - start-with-name   # drop "doc must start with symbol name"
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      # All SA/S/ST checks except the doc-comment checks the builder filters out
      # (ST1000 package, ST1020-1023 exported const/var/func/type).
      checks: ["all", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - lll
          - forcetypeassert
          - gosec
          - embeddedstructfieldcheck
          - goconst
          - varnamelen
          - gocritic
      - linters: [staticcheck]
        text: 'package comment should be of the form'
      - linters: [nilerr]
        text: 'error is nil \(.*\) but it returns error'
      - linters: [gocritic]
        text: 'may want to remove commented-out code'
      - linters: [gocritic]
        text: 'shadowing of predeclared identifier'
      - linters: [gocritic]
        text: 'appendCombine: can combine chain'
      - linters: [gocritic]
        text: 'unlambda:'

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
